apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-${COLOUR}
  namespace: ${NAMESPACE}
  labels:
    app: web
    colour: ${COLOUR}
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: web
      colour: ${COLOUR}
  template:
    metadata:
      labels:
        app: web
        colour: ${COLOUR}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ${IMAGE}
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
