name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Simulate a production failure (rollback drill)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thormie-harshey/cicd-security-gates:${{ github.sha }}

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-node-deps
      - run: npm run lint
      - run: npm run format-check

  test:
    name: Unit tests with coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-node-deps
      - run: npm test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/

  sast:
    name: SAST scan (Semgrep)
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan code, fail on high severity
        run: semgrep scan --config p/javascript --config p/nodejs --severity ERROR --error

  dependency-audit:
    name: Dependency vulnerability audit
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-node-deps
        with:
          install: "false"
      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high

  build-scan-push:
    name: Build, scan and push image
    needs: [test, sast, dependency-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image (multi-stage Dockerfile)
        run: docker build -t "$IMAGE" .

      - name: Report high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image with SHA tag
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE"

  deploy-staging:
    name: Deploy to staging and smoke test
    needs: build-scan-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Blue-green deploy to staging
        run: bash scripts/deploy.sh staging "$IMAGE"

      - name: Smoke test staging
        run: bash scripts/smoke-test.sh staging

  deploy-production:
    name: Deploy to production (approval required)
    needs: deploy-staging
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      PROD_TAG: ghcr.io/thormie-harshey/cicd-security-gates:production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Restore last known good version as blue
        run: |
          if docker manifest inspect "$PROD_TAG" > /dev/null 2>&1; then
            WATCH_OVERRIDE=5 bash scripts/deploy.sh production "$PROD_TAG"
          else
            echo "No production tag yet: first production deploy, nothing to restore"
          fi

      - name: Blue-green deploy with 5-minute health watch
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: bash scripts/deploy.sh production "$IMAGE"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark this image as last known good
        run: docker buildx imagetools create --tag "$PROD_TAG" "$IMAGE"

      - name: Show cluster state
        if: always()
        run: kubectl get deployments,pods,services -n production -o wide

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Production deployment: ${{ job.status }}"
            echo "- Image: \`$IMAGE\`"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
