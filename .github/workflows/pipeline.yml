name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thormie-harshey/cicd-security-gates:${{ github.sha }}

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format-check

  test:
    name: Unit tests with coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
  sast:
    name: SAST scan (Semgrep)
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Scan code, fail on high severity
        run: semgrep scan --config p/javascript --config p/nodejs --severity ERROR --error

  dependency-audit:
    name: Dependency vulnerability audit
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high

  build-scan-push:
    name: Build, scan and push image
    needs: [test, sast, dependency-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image (multi-stage Dockerfile)
        run: docker build -t "$IMAGE" .

      - name: Report high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image with SHA tag
        if: github.event_name == 'push'
        run: docker push "$IMAGE"

  deploy-staging:
    name: Deploy to staging and smoke test
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Blue-green deploy to staging
        run: bash scripts/deploy.sh staging "$IMAGE"

      - name: Smoke test staging
        run: bash scripts/smoke-test.sh staging

  deploy-production:
    name: Deploy to production (approval required)
    needs: deploy-staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      PROD_TAG: ghcr.io/thormie-harshey/cicd-security-gates:production
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Restore last known good version as blue
        run: |
          if docker manifest inspect "$PROD_TAG" > /dev/null 2>&1; then
            WATCH_OVERRIDE=5 bash scripts/deploy.sh production "$PROD_TAG"
          else
            echo "No production tag yet: first production deploy, nothing to restore"
          fi

      - name: Blue-green deploy with 5-minute health watch
        run: bash scripts/deploy.sh production "$IMAGE"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark this image as last known good
        run: docker buildx imagetools create --tag "$PROD_TAG" "$IMAGE"

      - name: Show cluster state
        if: always()
        run: kubectl get deployments,pods,services -n production -o wide

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Production deployment: ${{ job.status }}"
            echo "- Image: \`$IMAGE\`"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
